# Clusters live in a separate file: see clusters.example.yaml.
refresh: 5s
timeout: 15s
actions:
  - id: sh
    label: Shell (/bin/sh)
    argv: ["/bin/sh"]
    stdin: true
    tty: true
  - id: rails-console
    label: Rails console (bundle exec rails console)
    argv: ["bundle", "exec", "rails", "console"]
    stdin: true
    tty: true
# The action menu can run an action in a new pane. The multiplexer (tmux, zellij, herdr,
# WezTerm, kitty) is detected; set pane only for another command or layout.
# ktb appends its own command as separate arguments.
# pane: ["tmux", "split-window", "-v"]
