apiVersion: v1
kind: Namespace
metadata:
  name: ktb-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: list-only
  namespace: ktb-validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: list-only
  namespace: ktb-validation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: list-only
  namespace: ktb-validation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: list-only
subjects:
  - kind: ServiceAccount
    name: list-only
    namespace: ktb-validation
---
apiVersion: v1
kind: Pod
metadata:
  name: running
  namespace: ktb-validation
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: ktb-validation
  annotations:
    kubectl.kubernetes.io/default-container: second
spec:
  containers:
    - name: first
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
    - name: second
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: completed
  namespace: ktb-validation
spec:
  restartPolicy: Never
  containers:
    - name: job
      image: busybox:1.36
      command: ["sh", "-c", "echo done"]
